    name: "Debug Polling Mode"
    id: debug_polling_switch
    icon: "mdi:bug-check"
    optimistic: true

# ==============================================================================
# BUTTONS
# ==============================================================================
button:
  - platform: restart
    name: "Restart Leaf Module"

  - platform: template
    name: "Wake EV-CAN Bus"
    id: force_can_poll_button
    icon: "mdi:radar"
    on_press:
      - script.execute: request_bms_group_1
      - delay: 300ms
      - script.execute: request_bms_group_4
      - delay: 300ms
      - script.execute: request_bms_group_6
      - delay: 300ms
      - script.execute: request_bms_group_61

# ==============================================================================
# PASSIVE WAKE-UP / POLLING
# ==============================================================================
interval:
  # REVISION 3: the LBC groups are polled in a rotation while the car is
  # awake.  One request every 15 s, so every group is refreshed every 60 s:
  #   1 = SOC / AHR / HX      4 = pack temperatures
  #   6 = shunt status        61 = SOH
  - interval: 15s
    then:
      - if:
          condition:
            lambda: |-
              return id(debug_polling_switch).state ||
                     id(is_charging) ||
                     id(car_status_sensor).state == "ON" ||
                     id(car_status_sensor).state == "ACC" ||
                     id(car_status_sensor).state == "Charging/Standby";
          then:
            - lambda: |-
                id(bms_retry_count) = 0;
                switch (id(bms_group_index)) {
                  case 0: id(request_bms_group_1).execute(); break;
                  case 1: id(request_bms_group_4).execute(); break;
                  case 2: id(request_bms_group_6).execute(); break;
                  default: id(request_bms_group_61).execute(); break;
                }
                id(bms_group_index) = (id(bms_group_index) + 1) % 4;

  # status LED : green = CAN frames are being received, red = nothing
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              return (millis() - id(last_can_frame_ms)) < 5000;
          then:
            - light.turn_on:
                id: status_led
                red: 0
                green: 70%
                blue: 0
          else:
            - light.turn_on:
                id: status_led
                red: 70%
                green: 0
                blue: 0

script:
  # ISO-TP flow control (PC = 0x30)
  - id: bms_flow_control
    mode: single
    then:
      - canbus.send:
          can_id: 0x79B
          use_extended_id: false
          data: [0x30, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  # LBC group 6 : shunt status
  # The query is the two frames documented in Leaf2018-CAN.pdf:
  #   0x79B 02 21 06 00 00 00 00 00   (request group 6)
  #   0x79B 30 00 00 00 00 00 00 00   (flow control)
  # The old "send the flow control 250 ms later if nothing arrived" fallback
  # was wrong: it polluted the bus and arrived long after the LBC had already
  # answered (or not answered at all).
  # REVISION 3: every request also stores the group and the time of the
  # request, so that an incomplete answer can be repeated (see esphome on_loop).
  - id: request_bms_group_1
    mode: single
    then:
      - lambda: |-
          id(bms_ff_seen) = false;
          id(bms_requested_group) = 0x01;
          id(bms_last_request_ms) = millis();
      - canbus.send:
          can_id: 0x79B
          use_extended_id: false
          data: [0x02, 0x21, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 20ms
      - canbus.send:
          can_id: 0x79B
          use_extended_id: false
          data: [0x30, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  - id: request_bms_group_4
    mode: single
    then:
      - lambda: |-
          id(bms_ff_seen) = false;
          id(bms_requested_group) = 0x04;
          id(bms_last_request_ms) = millis();
      - canbus.send:
          can_id: 0x79B
          use_extended_id: false
          data: [0x02, 0x21, 0x04, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 20ms
      - canbus.send:
          can_id: 0x79B
          use_extended_id: false
          data: [0x30, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  - id: request_bms_group_6
    mode: single
    then:
      - lambda: |-
          id(bms_ff_seen) = false;
          id(bms_requested_group) = 0x06;
          id(bms_last_request_ms) = millis();
      - canbus.send:
          can_id: 0x79B
          use_extended_id: false
          data: [0x02, 0x21, 0x06, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 20ms
      - canbus.send:
          can_id: 0x79B
          use_extended_id: false
          data: [0x30, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  # LBC group 61 : SOH
  - id: request_bms_group_61
    mode: single
    then:
      - lambda: |-
          id(bms_ff_seen) = false;
          id(bms_requested_group) = 0x61;
          id(bms_last_request_ms) = millis();
      - canbus.send:
          can_id: 0x79B
          use_extended_id: false
          data: [0x02, 0x21, 0x61, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 20ms
      - canbus.send:
          can_id: 0x79B
          use_extended_id: false
          data: [0x30, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]
