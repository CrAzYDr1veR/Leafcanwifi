# ==============================================================================
#  ESP-LEAF  —  NISSAN LEAF ZE1 CAN MONITOR
#  ESP32-C3 Super Mini + SN65HVD230 | TX=GPIO4 | RX=GPIO3 | 500 kbps
# ==============================================================================

esp32:
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: esp-idf

api:
  encryption:
    key: !secret esp_leaf__key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: LeafCAN
    password: "12345678"

captive_portal:

logger:
  level: INFO

esphome:
  name: esp-leaf
  friendly_name: ESP_Leaf
  on_loop:
    - lambda: |-
        const uint32_t now = millis();
        if (id(bms_fc_pending) && id(bms_waiting_cf) && (now - id(bms_ff_ms)) > 100) {
          id(bms_fc_pending) = false;
          id(bms_waiting_cf) = false;
          id(bms_flow_control).execute();
        }
        if (id(bms_retry_pending) && id(bms_retry_count) < 3 && (now - id(bms_last_request_ms)) > 1500) {
          id(bms_retry_pending) = false;
          id(bms_retry_count)++;
          switch (id(bms_requested_group)) {
            case 0x01: id(request_bms_group_1).execute(); break;
            case 0x04: id(request_bms_group_4).execute(); break;
            case 0x06: id(request_bms_group_6).execute(); break;
            case 0x02: id(request_bms_group_2).execute(); break;
            case 0x84: id(request_bms_group_84).execute(); break;
            default:   id(request_bms_group_61).execute(); break;
          }
        }
        if (!id(bms_ff_seen) && !id(bms_retry_pending) && id(bms_retry_count) < 3 && id(bms_last_request_ms) > 0 && (now - id(bms_last_request_ms)) > 2500) {
          id(bms_retry_count)++;
          switch (id(bms_requested_group)) {
            case 0x01: id(request_bms_group_1).execute(); break;
            case 0x04: id(request_bms_group_4).execute(); break;
            case 0x06: id(request_bms_group_6).execute(); break;
            case 0x02: id(request_bms_group_2).execute(); break;
            case 0x84: id(request_bms_group_84).execute(); break;
            default:   id(request_bms_group_61).execute(); break;
          }
        }



# ==============================================================================
