  - platform: template
    name: "Cell Voltages 1-24"
    id: lbc_cells_1_sensor
    icon: "mdi:battery-charging"
  - platform: template
    name: "Cell Voltages 25-48"
    id: lbc_cells_2_sensor
    icon: "mdi:battery-charging"
  - platform: template
    name: "Cell Voltages 49-72"
    id: lbc_cells_3_sensor
    icon: "mdi:battery-charging"
  - platform: template
    name: "Cell Voltages 73-96"
    id: lbc_cells_4_sensor
    icon: "mdi:battery-charging"

# ==============================================================================
# BUTTONS, INTERVALS & SCRIPTS
# ==============================================================================
button:
  - platform: restart
    name: "Restart Leaf Module"
  - platform: template
    name: "Wake EV-CAN Bus"
    id: force_can_poll_button
    icon: "mdi:radar"
    on_press:
      - script.execute: request_bms_group_1
      - delay: 300ms
      - script.execute: request_bms_group_4
      - delay: 300ms
      - script.execute: request_bms_group_6
      - delay: 300ms
      - script.execute: request_bms_group_61

interval:
  - interval: 15s
    then:
      - if:
          condition:
            lambda: |-
              return id(is_charging) || id(car_status_sensor).state == "ON" || id(car_status_sensor).state == "ACC" || id(car_status_sensor).state == "Charging/Standby";
          then:
            - lambda: |-
                id(bms_retry_count) = 0;
                switch (id(bms_group_index)) {
                  case 0: id(request_bms_group_1).execute(); break;
                  case 1: id(request_bms_group_4).execute(); break;
                  case 2: id(request_bms_group_6).execute(); break;
                  case 3: id(request_bms_group_61).execute(); break;
                  case 4: id(request_bms_group_2).execute(); break;
                  default: id(request_bms_group_84).execute(); break;
                }
                id(bms_group_index) = (id(bms_group_index) + 1) % 6;

  - interval: 5s
    then:
      - if:
          condition:
            light.is_on: status_led
          then:
            - if:
                condition:
                  lambda: 'return (millis() - id(last_can_frame_ms)) < 5000;'
                then:
                  - light.turn_on:
                      id: status_led
                      red: 0%
                      green: 70%
                      blue: 0%
                else:
                  - light.turn_on:
                      id: status_led
                      red: 70%
                      green: 0%
                      blue: 0%

script:
  - id: request_bms_group_2
    mode: single
    then:
      - lambda: |-
          id(bms_ff_seen) = false; id(bms_requested_group) = 0x02; id(bms_last_request_ms) = millis();
      - canbus.send:
          can_id: 0x79B
          use_extended_id: false
          data: [0x02, 0x21, 0x02, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 20ms
      - canbus.send:
          can_id: 0x79B
          use_extended_id: false
          data: [0x30, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  - id: request_bms_group_84
    mode: single
    then:
      - lambda: |-
          id(bms_ff_seen) = false; id(bms_requested_group) = 0x84; id(bms_last_request_ms) = millis();
      - canbus.send:
          can_id: 0x79B
          use_extended_id: false
          data: [0x02, 0x21, 0x84, 0x00, 0x00, 0x00, 0x00, 0x00]
      - delay: 20ms
