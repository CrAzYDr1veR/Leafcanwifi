          can_id: 0x79B
          use_extended_id: false
          data: [0x30, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00]

  - id: bms_flow_control
    mode: single
    then:
      - canbus.send:
          can_id: 0x79B
